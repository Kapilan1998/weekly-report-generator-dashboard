spring.application.name=weekly-report-backend
# Spring Boot's own default is already 8080 - set explicitly so it's visible here rather than implicit.
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/weekly_report_dashboard?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=12345

# Schema is owned by Flyway migrations (src/main/resources/db/migration) - Hibernate only validates.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Off deliberately: with open-in-view on (the default) lazy loading keeps working outside a
# transaction, which hides mapping bugs until they surface somewhere far less convenient.
# All entity -> DTO mapping happens inside @Transactional(readOnly = true) read methods.
spring.jpa.open-in-view=false

# max-page-size defaults to 2000, so capping it here is load-bearing, not decoration.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false

# The brief requires a fixed report structure users cannot extend or reorder, so an unknown
# property is a 400 rather than a silent drop. It also makes any attempt to smuggle a field
# like status or userId into a payload fail loudly.
spring.jackson.deserialization.fail-on-unknown-properties=true

# Dev-only default secret (>= 256 bits for HS256) - override with the JWT_SECRET env var for anything beyond local dev.
app.jwt.secret=${JWT_SECRET:AGtyB9WPckgU%Ut@yRrwPCOVQghVob7nEUjmnk^o}
app.jwt.expiration-ms=3600000
