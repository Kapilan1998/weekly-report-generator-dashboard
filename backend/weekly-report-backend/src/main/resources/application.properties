spring.application.name=weekly-report-backend
server.port=8080

# Every value here is an env-var placeholder with a working local default, so a fresh clone
# runs with no configuration at all, and anyone whose MySQL differs overrides it without
# editing a committed file. See config/application.properties.example.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/weekly_report_dashboard?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}

# Schema is owned by Flyway migrations (src/main/resources/db/migration) - Hibernate only validates.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Off deliberately: with open-in-view on (the default) lazy loading keeps working outside a
# transaction, which hides mapping bugs until they surface somewhere far less convenient.
# All entity -> DTO mapping happens inside @Transactional(readOnly = true) read methods.
spring.jpa.open-in-view=false

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false


spring.jackson.deserialization.fail-on-unknown-properties=true


app.jwt.secret=${JWT_SECRET:dev-only-placeholder-set-JWT_SECRET-before-deploying}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# --- AI chat assistant (optional feature; absent key simply disables it) ---
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
