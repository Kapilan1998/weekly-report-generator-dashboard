# Overrides for the test profile. Everything not listed here is inherited from
# src/main/resources/application.properties, so this file stays a short diff rather than a
# second copy that can drift.

# A schema of its own, created on first connection. The tests delete rows as they set up, so
# pointing them at the development database would wipe whatever you were working with.
#
# Not H2 and not Testcontainers, deliberately:
#   - H2 can't run these migrations. V2 uses BIT(1) DEFAULT b'1', MySQL CHECK constraints and
#     MySQL-specific types, and with ddl-auto=validate the real migrations must run in every
#     @SpringBootTest context. H2's MySQL compatibility mode does not go far enough.
#   - Testcontainers would need Docker, which the README does not otherwise require. Anyone
#     who followed the README already has MySQL, so `mvnw test` works with no extra setup.
# Override spring.datasource.* on the command line if your MySQL credentials differ.
spring.datasource.url=jdbc:mysql://localhost:3306/weekly_report_dashboard_test?createDatabaseIfNotExist=true

# The demo loader would insert six users and 21 reports into the test schema and every
# assertion about "who exists" would be counting them.
app.seed.enabled=false

# A fixed secret so a failing test is reproducible rather than depending on the environment.
app.jwt.secret=test-only-secret-test-only-secret-test-only-secret
app.jwt.expiration-ms=3600000

# Flyway still owns the schema here: the point is to test against the real one.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
